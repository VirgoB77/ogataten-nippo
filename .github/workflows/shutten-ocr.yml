name: スキャンPDFの文字起こし

# 兵庫県・神戸市・和泉市の届出PDFは紙をスキャンした画像で、文字が取れない。
# Tesseract（日本語）で最初の2ページだけ読む。1本1.5秒。
# 毎週日曜の朝に走る。手でも押せる。読んだものは data/ocr/ に残す。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 6"   # 日曜 朝6時（日本時間）

concurrency:
  group: shutten
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 共通仕様9節「ワークフローの最初のステップでテストを走らせる」。
      # 監査で、このワークフローだけ検査を通さずに data/ocr をコミットしていた
      - name: 検査する
        run: python3 test_privacy.py

      - name: OCRの道具を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn poppler-utils
          tesseract --list-langs

      - name: 文字を起こす
        run: python3 ocr.py

      - name: 結果をしまう
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ocr
          if git diff --cached --quiet; then
            echo "変わりなし"
            exit 0
          fi
          git commit -m "スキャンPDFの文字を $(date -u +%Y-%m-%d) に起こした"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null || true; exit 1; }
            sleep $((i * 3))
          done
          exit 1
