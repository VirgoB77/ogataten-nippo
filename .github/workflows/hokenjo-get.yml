name: 保健所の営業許可の一覧をためる

# **週に1回走る。** 手でも押せる。
#
# なぜ週1か：兵庫県の更新は**毎月20日頃**と書かれている（案出しの調査・2026-09-19）。
# 月に1回しか変わらないものを毎日取っても、**相手の負荷が増えるだけで版は増えない。**
# 週1なら、どの版も必ず1回は掴める。
#
# **⚠️ この一覧には営業者氏名の欄がある。**
# だから**金庫がつながっていない回は、1バイトも取らない**（`KINKO` を立てない）。
# 成果物（artifact）に逃がす道も作らない——90日で消えるうえ、氏名が入っている。
#
# **時刻をずらしてある。** 毎朝の巡回（07:00 JST）・停電（07:20）・
# フロアマップ（08:10）と同じ相手を含むので、**13:00 JST**にしてある。
#
# **【2026-09-25 から、週1回の自動実行を一時停止している】**
# わけと戻し方は、下の schedule の所に書いた。
on:
  # **【一時停止 2026-09-25・統括判断】** 下の schedule: と - cron: の2行の頭に「#」を付けて止めた。
  # わけ：既定の入口（兵庫県）の行き先 web.pref.hyogo.lg.jp に、競売統計が毎朝7時30分に行っている。
  # 水曜にこちらも行くと、同じ相手に1日2本の置き場から行くことになる（相手の数で数える）。
  # 置き場をまたいで「今日どこへ行ったか」を控える仕組みができるまで、競売統計の1本に寄せる。
  # 戻すときは、その2行の頭の「#」を外すだけ（時刻は消していない。共通仕様「止める段と戻す段を同じ形で書く」）。
#  schedule:
    # 水曜 13:00 JST（UTC の 04:00）
#    - cron: "0 4 * * 3"
  workflow_dispatch:
    inputs:
      tane_id:
        description: "入口（カンマ区切り。空なら既定の6本＝hyogo-pref,amagasaki-city）。all で全部"
        required: false
        default: ""
      limit:
        description: "上から何件（0=全部）"
        required: false
        default: "0"

concurrency:
  group: hokenjo-get
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  get:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      # 金庫（生データの置き場・private）
      HAS_VAULT: ${{ secrets.RAW_DEPLOY_KEY != '' || secrets.RAW_TOKEN != '' }}
      RAW_REPO: ${{ github.repository }}-raw
    steps:
      # **日付と開始時刻を、同じ1つの時刻から決める**（日本時間）。予約台帳（common/kado.py）は
      # 開始が今日の日付か・23時台でないかを、この2つで見る
      - name: この実行の日付と開始時刻を決める
        run: |
          t=$(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M:%S+09:00)
          echo "RUN_DATE=${t%%T*}" >> "$GITHUB_ENV"
          echo "RUN_HAJIME=${t}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main
          # **浅い履歴だと、カードの承認の出どころを確かめられない**
          # （common/kado.py の shounin_dedokoro は git の履歴で承認を見る）
          fetch-depth: 0

      # 予約台帳（repo横断。同じ相手へ、同じ日本時間の日に、2つの置き場・2つの実行から行かない）。
      # 門（common/kado.py）が、相手への最初の外部通信の直前に、ここへ予約を1つ書いて push する。
      # **鍵が無い・出せないときは、ここで失敗して止まる**（予約できない回は、どこへも取りに行かない）
      - name: 予約台帳の鍵があることの確認
        env:
          ARU: ${{ secrets.YOYAKU_DEPLOY_KEY != '' }}
        run: |
          [ "$ARU" = "true" ] || { echo "予約台帳の鍵（YOYAKU_DEPLOY_KEY）が無い。この回はどこへも取りに行かない"; exit 1; }

      - name: 予約台帳を隣に出す
        uses: actions/checkout@v4
        with:
          repository: VirgoB77/kujiraya-aite-yoyaku
          ref: main
          ssh-key: ${{ secrets.YOYAKU_DEPLOY_KEY }}
          path: _yoyaku

      - name: 予約台帳の場所を門に渡す
        run: |
          echo "YOYAKU_DIR=${GITHUB_WORKSPACE}/_yoyaku" >> "$GITHUB_ENV"
          echo "YOYAKU_REPO=VirgoB77/kujiraya-aite-yoyaku" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 金庫を隣に出す
        if: env.HAS_VAULT == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RAW_REPO }}
          ref: main
          ssh-key: ${{ secrets.RAW_DEPLOY_KEY }}
          token: ${{ secrets.RAW_TOKEN || github.token }}
          path: _raw

      - name: 生データの置き場を金庫につなぐ
        id: link
        if: env.HAS_VAULT == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 金庫が private であることを確かめる（200=public・404=private・
          # それ以外は疑わしきは止まる）
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${RAW_REPO}" || true)
          case "$code" in
            404) echo "金庫 ${RAW_REPO} は公開側から見えない（private）" ;;
            200) echo "金庫 ${RAW_REPO} が public のまま。KINKO_DIR は渡さない"; exit 1 ;;
            *)   echo "金庫の見え方を確かめられなかった（HTTP ${code:-なし}）。止まる"; exit 1 ;;
          esac
          mkdir -p inbox
          mkdir -p "_raw/inbox/hokenjo-get"
          rm -rf "inbox/hokenjo-get"
          ln -s "../_raw/inbox/hokenjo-get" "inbox/hokenjo-get"
          ls -la inbox
          # **ここまで来た＝金庫が private だと確かめ、いま checkout もつないだ、
          # その成功の道。** common/kado.py の門に、金庫の場所を渡す
          # （確かめられなかった道では書かない。既存の KINKO=1 の関所とは別）
          echo "KINKO_DIR=$(pwd)/_raw" >> "$GITHUB_ENV"
          echo "KINKO_PRIVATE=1" >> "$GITHUB_ENV"

      - name: 検査する
        run: ./check.sh

      # **KINKO を立てるのは、金庫がつながった回だけ。**
      # 立っていなければ、この段は取りに行かずに終わる（氏名が入っているため）
      - name: 一覧をためる（同時1本・5秒以上あける）
        timeout-minutes: 30
        env:
          KINKO: ${{ steps.link.outcome == 'success' && '1' || '' }}
        run: |
          # **既定は6本**（兵庫県4＋尼崎2）。統括の決定・2026-09-21——
          # 「まず6本で一連の観測系を確認してから、67本への展開を判断する」。
          # **定期実行もここを通る。** 全部にするときは tane_id に all を入れる。
          TANE="${{ github.event.inputs.tane_id }}"
          [ -z "$TANE" ] && TANE="hyogo-pref,amagasaki-city"
          if [ "$TANE" = "all" ]; then
            python3 hokenjo_get.py --limit "${{ github.event.inputs.limit || 0 }}"
          else
            python3 hokenjo_get.py --limit "${{ github.event.inputs.limit || 0 }}" \
              --tane-id "$TANE"
          fi

      - name: 生データを金庫にしまう
        if: ${{ env.HAS_VAULT == 'true' && !cancelled() && steps.link.outcome == 'success' }}
        working-directory: _raw
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox
          if [ -n "$(find inbox -type f -print -quit 2>/dev/null)" ] \
             && [ -z "$(git ls-files -- inbox)" ]; then
            echo "inbox にファイルがあるのに、1件も追跡できていない。"
            echo "金庫の .gitignore が inbox を外している疑い。止まる"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "変わっていない"
            exit 0
          fi
          git commit -m "保健所の営業許可の生データ（${RUN_DATE}）"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1

      # 入るのは**指紋と大きさと日付だけ。** 一覧の中身は1文字も入らない
      - name: 記録を残す
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ref/hokenjo-get.md data/ref/hokenjo-ledger.json
          # 門（common/kado.py）の記録（今日もう見たか・機械札）。次の回にも効くので持ち越す
          git add data/ref/aite-kyou.json data/ref/kikai-fuda.json
          if git diff --cached --quiet; then
            echo "変わっていない"
            exit 0
          fi
          git commit -m "保健所の営業許可をためた記録（${RUN_DATE}）"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
