name: 遅延証明書のページを探しに行く

# **手で押したときだけ動く。** schedule は無い。
#
# ここは「探すだけ」の回。読み取りはまだ書いていない（9節「見本は実物から取る」）。
# **URL は作文していない。** 各社のトップから、リンクの文字で辿る。
#
# **出どころが民間**なのが、既存4サイトと違うところ。
# 鉄道会社には公表する義務が無い。robots を守り、嫌がられたら止める（3.4）。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "いくつの会社を見に行くか（既定3。全部なら 10）"
        required: false
        default: "3"

concurrency:
  group: chien-recon
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      # **日付と開始時刻を、同じ1つの時刻から決める**（日本時間）。予約台帳（common/kado.py）は
      # 開始が今日の日付か・23時台でないかを、この2つで見る
      - name: この実行の日付と開始時刻を決める
        run: |
          t=$(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M:%S+09:00)
          echo "RUN_DATE=${t%%T*}" >> "$GITHUB_ENV"
          echo "RUN_HAJIME=${t}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main
          # **浅い履歴だと、カードの承認の出どころを確かめられない**
          # （chien_get.py が門につながっているため。common/kado.py の
          # shounin_dedokoro は git の履歴で承認を見る）
          fetch-depth: 0

      # 予約台帳（repo横断。同じ相手へ、同じ日本時間の日に、2つの置き場・2つの実行から行かない）。
      # 門（common/kado.py）が、相手への最初の外部通信の直前に、ここへ予約を1つ書いて push する。
      # **鍵が無い・出せないときは、ここで失敗して止まる**（予約できない回は、どこへも取りに行かない）
      - name: 予約台帳の鍵があることの確認
        env:
          ARU: ${{ secrets.YOYAKU_DEPLOY_KEY != '' }}
        run: |
          [ "$ARU" = "true" ] || { echo "予約台帳の鍵（YOYAKU_DEPLOY_KEY）が無い。この回はどこへも取りに行かない"; exit 1; }

      - name: 予約台帳を隣に出す
        uses: actions/checkout@v4
        with:
          repository: VirgoB77/kujiraya-aite-yoyaku
          ref: main
          ssh-key: ${{ secrets.YOYAKU_DEPLOY_KEY }}
          path: _yoyaku

      - name: 予約台帳の場所を門に渡す
        run: |
          echo "YOYAKU_DIR=${GITHUB_WORKSPACE}/_yoyaku" >> "$GITHUB_ENV"
          echo "YOYAKU_REPO=VirgoB77/kujiraya-aite-yoyaku" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 共通仕様9節「ワークフローの最初のステップでテストを走らせる」。
      # **外に出る前に止まる**（監査 r1-43 と同じ穴・2026-09-20）
      - name: 検査する
        run: ./check.sh

      - name: 遅延証明書のページを探す（同時1本・5秒以上あける）
        run: python3 chien_recon.py --limit "${{ github.event.inputs.limit || 3 }}"

      # 2段目。**1段目の記録から行き先を読む。** カードの門（common/kado.py）
      # につながっている。金庫（KINKO_DIR）が無いので、この workflow では
      # 実際には保存できず、門で止まる（それでよい。金庫のつなぎ込みは別の workflow）。
      # 見つからなければ何もしない（記録が無ければ 1 で止まる）
      - name: 見つけたページを取ってくる（ホストごとに robots を見直す）
        run: python3 chien_get.py

      # 入れるのは**数えた記録と、見つけたリンクだけ。** 中身は入れない
      - name: 記録を残す
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ref/chien-recon.md data/ref/chien-get.md
          if git diff --cached --quiet; then
            echo "変わっていない"
            exit 0
          fi
          git commit -m "遅延証明書のページを探した記録（${RUN_DATE}）"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
