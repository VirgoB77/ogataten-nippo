name: 取得可否確認（preflight・手で押すだけ）

# 新しい取得元を「取ってよいか」判断するための、最小の確認（2026-09-27・統括判断）。
# **運営者が手で書いた許可（data/ref/preflight/approvals/<許可ID>.json）がある相手だけ。**
# 許可は発行から24時間・1回だけ。**本番の取得承認ではない**（本番の承認は data/ref/shounin/）。
#
# 送るのは robots.txt・一覧・詳細の最大3本（common/kado.py の kakunin が数えて、超えたら止める）。
# GET だけ。転送は辿らない。拒否・認証・CAPTCHA が出たら、残りを出さずに止まる。
# 残すのは記録（data/ref/preflight/records/）だけ。**本文は残さない**（SHA-256 と長さだけ）。
#
# schedule は持たない。**押したときだけ。**
on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: "許可ID（data/ref/preflight/approvals/<許可ID>.json のファイル名）"
        required: true

concurrency:
  group: kakunin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  kakunin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      # **日付と開始時刻を、同じ1つの時刻から決める**（日本時間）。予約台帳（common/kado.py）は
      # 開始が今日の日付か・23時台でないかを、この2つで見る
      - name: この実行の日付と開始時刻を決める
        run: |
          t=$(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M:%S+09:00)
          echo "RUN_DATE=${t%%T*}" >> "$GITHUB_ENV"
          echo "RUN_HAJIME=${t}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main
          # **浅い履歴だと、許可の出どころ（運営者の手か）を確かめられない**
          fetch-depth: 0

      # 予約台帳（repo横断。同じ相手へ、同じ日本時間の日に、2つの置き場・2つの実行から行かない）。
      # 取得可否確認の予約には許可IDが載る。**台帳は追記だけなので、許可を2回使わない跡になる**
      - name: 予約台帳の鍵があることの確認
        env:
          ARU: ${{ secrets.YOYAKU_DEPLOY_KEY != '' }}
        run: |
          [ "$ARU" = "true" ] || { echo "予約台帳の鍵（YOYAKU_DEPLOY_KEY）が無い。この回はどこへも取りに行かない"; exit 1; }

      - name: 予約台帳を隣に出す
        uses: actions/checkout@v4
        with:
          repository: VirgoB77/kujiraya-aite-yoyaku
          ref: main
          ssh-key: ${{ secrets.YOYAKU_DEPLOY_KEY }}
          path: _yoyaku

      - name: 予約台帳の場所を門に渡す
        run: |
          echo "YOYAKU_DIR=${GITHUB_WORKSPACE}/_yoyaku" >> "$GITHUB_ENV"
          echo "YOYAKU_REPO=VirgoB77/kujiraya-aite-yoyaku" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 検査する
        run: ./check.sh

      # 許可IDは env で渡す（run の中に直に埋めない）。形は kakunin.py と門が確かめる
      - name: 確かめる（robots.txt・一覧・詳細の最大3本）
        timeout-minutes: 10
        env:
          KYOKA: ${{ github.event.inputs.approval_id }}
        run: python3 kakunin.py "$KYOKA"

      # 止まった回も記録は残す。**しまうのは記録と、門自身の控え（今日の控え・機械札）だけ。**
      # 許可（approvals/）とカードは機械が書かない。混ざったら止まる
      - name: 記録をしまう
        if: always()
        env:
          KYOKA: ${{ github.event.inputs.approval_id }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/ref/preflight/records data/ref/aite-kyou.json data/ref/kikai-fuda.json; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "記録なし"
            exit 0
          fi
          if git diff --cached --name-only | grep -v -E '^data/ref/(preflight/records/.+\.json|aite-kyou\.json|kikai-fuda\.json)$'; then
            echo "記録と控えのほかのものが混ざった。止まる"
            exit 1
          fi
          git commit -m "取得可否確認の記録（${RUN_DATE}・${KYOKA}）"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
