name: 停電の記録を毎日ためる

# **毎日走る。** 7日で消えるので、**今日ためなかった分は、もう作れない。**
#
# ここは「ためるだけ」。**読み取らない。**
# 返ってきたバイトをそのまま置いて、**指紋を取って前と比べる**だけ。
#
# **1段目（teiden-recon）を押した日は、この段が自分で止まる。**
# 同じ相手に1日2回行かないため（3.4・**相手の数で数える**）。
#
# **【2026-09-25 から、朝の自動実行を一時停止している】**
# わけと戻し方は、下の schedule の所に書いた。
on:
  # **【一時停止 2026-09-25・統括判断】** 下の schedule: と - cron: の2行の頭に「#」を付けて止めた。
  # わけ：teiden_get.py は約束の台帳で「取ってはいけない」の相手だけを外し、
  # 「未確認」の相手には毎日取りに行く（正本9節「1回だけ見る」と「毎日取る」を分ける）。
  # （ここまでは 2026-09-25 当時の記述。いまは、取りに行く前の門 common/kado.py も通る。正本3.4）
  # 戻すときは、その2行の頭の「#」を外すだけ（時刻は消していない。共通仕様「止める段と戻す段を同じ形で書く」）。
#  schedule:
    # 07:20 JST（毎朝の巡回とは別の相手なので、時間をずらすだけでよい）
#    - cron: "20 22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "行き先の数（0=全部）"
        required: false
        default: "0"

concurrency:
  group: teiden-get
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  get:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      # 金庫（生データの置き場・private）。**無い回も走る。**
      # 金庫はしまい方の話で、取りに行くかどうかの話ではない（2026-09-20）。
      # 鍵は2通り。**どちらか片方あればよい。**
      #   RAW_DEPLOY_KEY  SSH の deploy key。期限が無い。**作るのにターミナルが要る**
      #   RAW_TOKEN       fine-grained PAT。**GitHubの画面だけで作れる（スマホで足りる）**
      #                   ただし**最長1年で切れる。切れた日は赤くなって止まる**（黙らない）
      HAS_VAULT: ${{ secrets.RAW_DEPLOY_KEY != '' || secrets.RAW_TOKEN != '' }}
      RAW_REPO: ${{ github.repository }}-raw
    steps:
      - name: この実行の日付を決める
        run: echo "RUN_DATE=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: main
          # **浅い履歴だと、カードの承認の出どころを確かめられない**
          # （common/kado.py の shounin_dedokoro は git の履歴で承認を見る）
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 金庫を隣に出す
        if: env.HAS_VAULT == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RAW_REPO }}
          ref: main
          # **両方渡す。** checkout は ssh-key が空なら token のほうを使う
          ssh-key: ${{ secrets.RAW_DEPLOY_KEY }}
          token: ${{ secrets.RAW_TOKEN || github.token }}
          path: _raw

      - name: 生データの置き場を金庫につなぐ
        id: link
        if: env.HAS_VAULT == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 金庫が private であることを確かめる（200=public・404=private・
          # それ以外は疑わしきは止まる）
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${RAW_REPO}" || true)
          case "$code" in
            404) echo "金庫 ${RAW_REPO} は公開側から見えない（private）" ;;
            200) echo "金庫 ${RAW_REPO} が public のまま。KINKO_DIR は渡さない"; exit 1 ;;
            *)   echo "金庫の見え方を確かめられなかった（HTTP ${code:-なし}）。止まる"; exit 1 ;;
          esac
          mkdir -p inbox
          mkdir -p "_raw/inbox/teiden"
          rm -rf "inbox/teiden"
          ln -s "../_raw/inbox/teiden" "inbox/teiden"
          ls -la inbox
          # **ここまで来た＝金庫が private だと確かめ、いま checkout もつないだ、
          # その成功の道。** common/kado.py の門に、金庫の場所を渡す
          # （確かめられなかった道では書かない）
          echo "KINKO_DIR=$(pwd)/_raw" >> "$GITHUB_ENV"
          echo "KINKO_PRIVATE=1" >> "$GITHUB_ENV"

      # 取りに行く前に、まず検査を通す（もとは共通仕様9節の決まり。いまの正本には、この見出しが無い）
      - name: 検査する
        run: ./check.sh

      # **条件を付けない。** 金庫の有無は「しまい方」の話で、
      # 「取りに行くかどうか」の話ではない（2026-09-20、1度も走らない段を作った）
      - name: ためる（同時1本・5秒以上あける・robots を見る）
        timeout-minutes: 45
        run: python3 teiden_get.py --limit "${{ github.event.inputs.limit || 0 }}"

      # **取り直せないものを先にしまう。** 金庫は private なので、公開側の検査を待たない。
      # **7日で消えるものなので、ここが本番。** 成果物は金庫が無い回の保険
      - name: 生データを金庫にしまう
        if: ${{ env.HAS_VAULT == 'true' && !cancelled() && steps.link.outcome == 'success' }}
        working-directory: _raw
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox
          # **金庫側が inbox を無視していると、黙って1件も入らない**（3.4・0件は0件ではない）
          if git status --porcelain inbox | grep -q .; then :; else
            echo "金庫に1件も入らなかった。金庫の .gitignore が inbox を無視していないか"
          fi
          if git diff --cached --quiet; then
            echo "変わっていない"
            exit 0
          fi
          git commit -m "停電の生データ（${RUN_DATE}）"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1

      # 入れるのは**指紋の台帳と記録だけ。** 中身は入れない
      - name: 記録を残す
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ref/teiden-get.md data/ref/teiden-ledger.json
          # 門（common/kado.py）の記録（今日もう見たか・機械札）。次の回にも効くので持ち越す
          git add data/ref/aite-kyou.json data/ref/kikai-fuda.json
          if git diff --cached --quiet; then
            echo "変わっていない"
            exit 0
          fi
          git commit -m "停電の記録をためた（${RUN_DATE}）"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
